name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Download & Run Gradle
      run: |
        echo "=== Installing Standalone Gradle ==="
        wget -q https://services.gradle.org/distributions/gradle-8.6-bin.zip
        unzip -q gradle-8.6-bin.zip
        export PATH=$PWD/gradle-8.6/bin:$PATH

        echo "=== Verifying Gradle Version ==="
        gradle --version

        echo "=== Building APK ==="
        gradle assembleDebug --no-daemon --stacktrace

    - name: Upload Finished APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Nuvio-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
